[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qobuz-mcp"
version = "0.1.0"
description = "MCP server for the Qobuz music streaming service"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
qobuz-mcp = "qobuz_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qobuz_mcp"]
